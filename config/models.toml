# Stringer model layer (settled Nov 24: one LiteLLM layer).
# Each pipeline step names one model alias; evals swap models by editing one line under [steps].
# Prices are USD per million tokens, from the Vertex and Anthropic price lists (map, Cross-cutting,
# Nov 24). Code computes cost from these, so the log shows cost even for models LiteLLM doesn't know.

[vertex]
project = "agentic-ai-msds"
location = "global"
# The gcloud login's quota project differs, so every Vertex call names the billing project.
user_project_header = "agentic-ai-msds"

[anthropic]
keychain_item = "anthropic_api_key"

[openrouter]
# Added Nov 26 (Jan: "experiment with openrouter if there are viable alternatives"). Key name, looked up upper-case in .env.
key_item = "openrouter_api_key"

[langfuse]
# Key names (looked up upper-case in .env); when they are missing, calls are still logged locally (stringer_private/runs/).
public_key_item = "langfuse_public_key"
secret_key_item = "langfuse_secret_key"
host_item = "langfuse_host"          # optional; default https://cloud.langfuse.com

[steps]
query_writer = "gemini-3.5-flash-lite"   # module 1: reworded, side and background queries
same_story = "deepseek-v4.1-flash"       # module 2 (to be chosen by its eval)
lens = "haiku-5-5"                       # module 4, choosing the sides (decided Nov 26, Jan, from its eval: prompt lens-3, 36 of 40 cold, 39 of 40 menu; ~0.06 cents a story)
brief_read = "deepseek-v4.1-flash"       # module 5 step 1 (decided Nov 25, Jan, from the step 1 eval)
brief_onecall = "sonnet-5-5"             # module 5 baseline to beat: one call writes the Story File
brief_merge = "deepseek-v4.1-flash"      # module 5 step 2 (decided Nov 25, Jan: Sonnet and GLM cost too much; prompt to be tuned)
brief_framing = "sonnet-5-5"             # module 5 step 4, how each side tells it (decided Nov 25, Jan: sharper points, 55 of 60 good vs DeepSeek 51; ~1.9 cents a story)
brief_blind = "deepseek-v4.1-flash"      # module 5 step 3b: blindspot judge (Nov 25, same model as steps 1 and 2)
fact_check = "haiku-5-5"                 # module 6 judge (decided Nov 26, Jan: "haiku is good enough ... considering the cost and time"; check-5: 48 of 51 planted, 0.85% good claims lost, 1.4 cents a story)
script = "gpt-6.1-terra"                 # module 7 writer (decided Nov 26, Jan: "Yes, use Terra"; model selection: 37% clean first drafts vs Haiku 19%, 3.8 cents and 75 s a story)
script_line_check = "haiku-5-5"         # module 7 line check: the fact check's model (decided Nov 26, Jan: all as recommended)
script_words = "gemini-3.5-flash-lite"  # module 7 loaded-words check: wording-1's judge (Nov 26, same)
voice_direction = "haiku-5-5"            # module 8 voice director (Jan, Nov 26: "v4 turbo with expressive tags"; ~0.07 cents a story)

# ---- Models. shortlist = true: the smoke test checks it answers and reports cached tokens ----

[models."haiku-5-5"]
litellm = "anthropic/claude-haiku-5-5"
provider = "anthropic"
input = 0.10
output = 0.50
cached_input = 0.01
cache_write = 0.125        # 1.25x input (5-minute cache)
shortlist = true

[models."sonnet-5-5"]
litellm = "anthropic/claude-sonnet-5-5"
